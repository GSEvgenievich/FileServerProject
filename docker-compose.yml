services:
  postgres:
    image: postgres:15-alpine
    container_name: file-db
    environment:
      POSTGRES_USER: fileuser
      POSTGRES_PASSWORD: secretpass123
      POSTGRES_DB: FileStorageDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - file-network

  minio:
    image: minio/minio:latest
    container_name: file-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - file-network

  api:
    build:
      context: .
      dockerfile: FileServer.API/Dockerfile
    container_name: file-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=FileStorageDb;Username=fileuser;Password=secretpass123
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=minioadmin
      - Minio__SecretKey=minioadmin
      - Minio__BucketName=uploads
    ports:
      - "5000:8080"
    depends_on:
      - postgres
      - minio
    networks:
      - file-network

volumes:
  postgres_data:
  minio_data:

networks:
  file-network:
    driver: bridge